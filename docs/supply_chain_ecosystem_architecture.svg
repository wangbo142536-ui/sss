  <rect x="420" y="515" width="132" height="28" rx="14" class="pill"/><text x="442" y="535" class="pillText">伙食采购</text>
  <rect x="565" y="515" width="132" height="28" rx="14" class="pill"/><text x="587" y="535" class="pillText">物料采购</text>
  <rect x="710" y="515" width="132" height="28" rx="14" class="pill"/><text x="732" y="535" class="pillText">供应商池</text>
  <rect x="855" y="515" width="132" height="28" rx="14" class="pill"/><text x="877" y="535" class="pillText">气象服务</text>
