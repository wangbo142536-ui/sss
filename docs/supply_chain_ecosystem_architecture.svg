<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
  <defs>
    <style>
      .bg{fill:#f6f8fb}.title{font:700 34px "Microsoft YaHei",Arial,sans-serif;fill:#102033}.sub{font:400 18px "Microsoft YaHei",Arial,sans-serif;fill:#526276}.group{fill:#fff;stroke:#d8e2ef;stroke-width:2}.core{fill:#f8fbff;stroke:#8fb7ff;stroke-width:2}.finance{fill:#fff8ec;stroke:#efb35a;stroke-width:2}.gov{fill:#f2fbf5;stroke:#6abd82;stroke-width:2}.third{fill:#f7f4ff;stroke:#9a80e9;stroke-width:2}.actor{fill:#102033}.actorText{font:700 18px "Microsoft YaHei",Arial,sans-serif;fill:#fff}.actorSmall{font:400 13px "Microsoft YaHei",Arial,sans-serif;fill:#d7e2ef}.box{fill:#fff;stroke:#c9d7e8;stroke-width:1.6}.boxTitle{font:700 17px "Microsoft YaHei",Arial,sans-serif;fill:#12243a}.boxText{font:400 13px "Microsoft YaHei",Arial,sans-serif;fill:#526276}.label{font:700 18px "Microsoft YaHei",Arial,sans-serif;fill:#24364a}.smallLabel{font:400 13px "Microsoft YaHei",Arial,sans-serif;fill:#607186}.arrow{stroke:#6f8197;stroke-width:2;fill:none;marker-end:url(#arrow)}.arrowBlue{stroke:#2f6fed;stroke-width:2.4;fill:none;marker-end:url(#arrowBlue)}.arrowGold{stroke:#cf842f;stroke-width:2.4;fill:none;marker-end:url(#arrowGold)}.arrowGreen{stroke:#3f9b62;stroke-width:2.2;fill:none;marker-end:url(#arrowGreen)}.pill{fill:#eaf2ff;stroke:#b9d2ff}.pillText{font:700 14px "Microsoft YaHei",Arial,sans-serif;fill:#2455a6}
