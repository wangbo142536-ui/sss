    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#6f8197"/></marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#2f6fed"/></marker>
    <marker id="arrowGold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#cf842f"/></marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#3f9b62"/></marker>
  </defs>
  <rect class="bg" width="1800" height="1120"/>
  <text x="70" y="70" class="title">船供供应链生态架构图</text>
  <text x="70" y="103" class="sub">覆盖现有采购链路，并扩展供应链金融、政府侧、银行与三方生态协同</text>

  <rect x="70" y="145" width="260" height="110" rx="10" class="actor"/>
  <text x="100" y="183" class="actorText">船代 / 买方企业</text>
  <text x="100" y="212" class="actorSmall">导入需求、比价下单、付款</text>
  <text x="100" y="234" class="actorSmall">申请融资、查看履约与归档</text>

  <rect x="1470" y="145" width="260" height="110" rx="10" class="actor"/>
  <text x="1500" y="183" class="actorText">供货商企业</text>
  <text x="1500" y="212" class="actorSmall">SKU 上架、报价、确认订单</text>
  <text x="1500" y="234" class="actorSmall">备货、供船、回款</text>

  <rect x="1470" y="310" width="260" height="110" rx="10" class="actor"/>
  <text x="1500" y="348" class="actorText">驳船 / 交通艇 / 配送方</text>
  <text x="1500" y="377" class="actorSmall">航线调度、锚地送船</text>
  <text x="1500" y="399" class="actorSmall">签收、异常上报、图片回传</text>

  <rect x="70" y="310" width="260" height="110" rx="10" class="actor"/>
  <text x="100" y="348" class="actorText">船员 / 船舶服务</text>
  <text x="100" y="377" class="actorSmall">登轮、接送、生活服务</text>
  <text x="100" y="399" class="actorSmall">报关报备、港区通行协同</text>

  <rect x="390" y="145" width="1020" height="410" rx="14" class="core"/>
  <text x="420" y="183" class="label">平台核心供应链能力</text>
  <text x="420" y="211" class="smallLabel">以采购单为主线，把标准库、供应商、报价、履约、结算和单证串成可追踪链路</text>

  <rect x="425" y="245" width="180" height="92" rx="8" class="box"/>
  <text x="447" y="277" class="boxTitle">需求导入</text>
  <text x="447" y="304" class="boxText">Excel / Word / PDF</text>
  <text x="447" y="324" class="boxText">船舶、港口、ETA、询价号</text>

  <rect x="645" y="245" width="180" height="92" rx="8" class="box"/>
  <text x="667" y="277" class="boxTitle">标准库</text>
  <text x="667" y="304" class="boxText">IMPA / MSG</text>
  <text x="667" y="324" class="boxText">伙食分类、数据字典</text>

  <rect x="865" y="245" width="180" height="92" rx="8" class="box"/>
  <text x="887" y="277" class="boxTitle">智能匹配</text>
  <text x="887" y="304" class="boxText">标准编码校验</text>
  <text x="887" y="324" class="boxText">供应商 SKU / 异常复核</text>

  <rect x="1085" y="245" width="180" height="92" rx="8" class="box"/>
  <text x="1107" y="277" class="boxTitle">询价报价</text>
  <text x="1107" y="304" class="boxText">供货商响应</text>
  <text x="1107" y="324" class="boxText">报价保存、原模板导出</text>

  <rect x="425" y="385" width="180" height="92" rx="8" class="box"/>
  <text x="447" y="417" class="boxTitle">比价决策</text>
  <text x="447" y="444" class="boxText">最低混供 / 集中采购</text>
  <text x="447" y="464" class="boxText">利润报价、币种切换</text>

  <rect x="645" y="385" width="180" height="92" rx="8" class="box"/>
  <text x="667" y="417" class="boxTitle">采购订单</text>
  <text x="667" y="444" class="boxText">联系人快照</text>
  <text x="667" y="464" class="boxText">主单 / 供货商子单</text>

  <rect x="865" y="385" width="180" height="92" rx="8" class="box"/>
  <text x="887" y="417" class="boxTitle">履约供船</text>
  <text x="887" y="444" class="boxText">确认、备货完成</text>
  <text x="887" y="464" class="boxText">供船图片、签收</text>

  <rect x="1085" y="385" width="180" height="92" rx="8" class="box"/>
  <text x="1107" y="417" class="boxTitle">结算归档</text>
  <text x="1107" y="444" class="boxText">费用、发票、付款</text>
  <text x="1107" y="464" class="boxText">单证、核销资料</text>

  <path d="M605 291 H645" class="arrowBlue"/>
