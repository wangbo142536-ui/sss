  <rect x="390" y="610" width="1020" height="190" rx="14" class="finance"/>
  <text x="420" y="648" class="label">供应链金融资金链</text>
  <text x="420" y="676" class="smallLabel">采购单下单后形成应付金额，可拆分为企业预付与金融贷款</text>
  <rect x="425" y="705" width="150" height="62" rx="8" class="box"/>
  <text x="446" y="742" class="boxTitle">应付金额</text>
  <rect x="615" y="705" width="150" height="62" rx="8" class="box"/>
  <text x="636" y="732" class="boxTitle">买方预付</text>
  <text x="636" y="754" class="boxText">示例 20%</text>
  <rect x="805" y="705" width="150" height="62" rx="8" class="box"/>
  <text x="826" y="732" class="boxTitle">融资贷款</text>
  <text x="826" y="754" class="boxText">示例 80%</text>
  <rect x="995" y="705" width="150" height="62" rx="8" class="box"/>
  <text x="1016" y="732" class="boxTitle">放款</text>
  <text x="1016" y="754" class="boxText">至供货商/监管账户</text>
  <rect x="1185" y="705" width="150" height="62" rx="8" class="box"/>
  <text x="1206" y="732" class="boxTitle">还款结清</text>
  <text x="1206" y="754" class="boxText">到期 / 逾期 / 结清</text>
  <path d="M575 736 H615" class="arrowGold"/>
  <path d="M765 736 H805" class="arrowGold"/>
  <path d="M955 736 H995" class="arrowGold"/>
  <path d="M1145 736 H1185" class="arrowGold"/>

  <rect x="70" y="610" width="260" height="190" rx="14" class="finance"/>
  <text x="100" y="648" class="label">银行 / 金融机构</text>
  <text x="100" y="684" class="boxText">授信额度</text>
  <text x="100" y="710" class="boxText">融资审批</text>
  <text x="100" y="736" class="boxText">放款确认</text>
  <text x="100" y="762" class="boxText">还款与风险预警</text>

  <rect x="1470" y="610" width="260" height="190" rx="14" class="gov"/>
  <text x="1500" y="648" class="label">政府侧</text>
  <text x="1500" y="684" class="boxText">政府补贴：航运、外贸、数字化、普惠金融</text>
  <text x="1500" y="710" class="boxText">资质与信用监管</text>
  <text x="1500" y="736" class="boxText">港口 / 海事 / 海关协同</text>
  <text x="1500" y="762" class="boxText">合规留痕与补贴核验</text>

  <rect x="70" y="850" width="1660" height="180" rx="14" class="third"/>
  <text x="100" y="888" class="label">三方生态接入</text>
  <text x="100" y="916" class="smallLabel">增强清单识别、风险判断、港区作业窗口、合同单证与金融风控</text>
  <rect x="105" y="945" width="190" height="58" rx="8" class="box"/><text x="127" y="980" class="boxTitle">气象 / 潮汐 / 锚地</text>
  <rect x="330" y="945" width="190" height="58" rx="8" class="box"/><text x="352" y="980" class="boxTitle">AIS / 船期 / 靠离泊</text>
  <rect x="555" y="945" width="190" height="58" rx="8" class="box"/><text x="577" y="980" class="boxTitle">海关 / 报关报备</text>
  <rect x="780" y="945" width="190" height="58" rx="8" class="box"/><text x="802" y="980" class="boxTitle">保险 / 保函 / 风控</text>
  <rect x="1005" y="945" width="190" height="58" rx="8" class="box"/><text x="1027" y="980" class="boxTitle">电子签章 / 合同</text>
  <rect x="1230" y="945" width="190" height="58" rx="8" class="box"/><text x="1252" y="980" class="boxTitle">OCR / AI 识别</text>
  <rect x="1455" y="945" width="190" height="58" rx="8" class="box"/><text x="1477" y="980" class="boxTitle">支付 / 票税 / 对账</text>

