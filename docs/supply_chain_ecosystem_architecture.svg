  <text x="70" y="1080" class="smallLabel">输出依据：项目 PRODUCT、长期记忆、页面规格、供应链金融一期需求。说明：官方 GitHub skills 列表未发现专门的 architecture/diagram skill，本图采用可维护 SVG + Mermaid 源文件落地。</text>
