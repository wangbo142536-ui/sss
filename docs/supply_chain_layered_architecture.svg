<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1220" viewBox="0 0 1900 1220">
  <defs>
    <style>
      .bg{fill:#f4f7fb}.title{font:700 34px "Microsoft YaHei",Arial,sans-serif;fill:#102033}.sub{font:400 18px "Microsoft YaHei",Arial,sans-serif;fill:#55667a}.layer{fill:#fff;stroke:#d7e1ee;stroke-width:2}.layerTitle{font:700 20px "Microsoft YaHei",Arial,sans-serif;fill:#16283d}.layerNote{font:400 13px "Microsoft YaHei",Arial,sans-serif;fill:#637287}.box{fill:#fff;stroke:#c8d6e6;stroke-width:1.5}.boxBlue{fill:#f5f9ff;stroke:#78a9ff;stroke-width:1.8}.boxGold{fill:#fff8ed;stroke:#e3a344;stroke-width:1.8}.boxGreen{fill:#f3fbf5;stroke:#5dbd7a;stroke-width:1.8}.boxPurple{fill:#f8f5ff;stroke:#9b83ea;stroke-width:1.8}.boxDark{fill:#102033;stroke:#102033;stroke-width:1.8}.boxTitle{font:700 16px "Microsoft YaHei",Arial,sans-serif;fill:#102033}.boxTitleLight{font:700 16px "Microsoft YaHei",Arial,sans-serif;fill:#fff}.boxText{font:400 12.5px "Microsoft YaHei",Arial,sans-serif;fill:#55667a}.boxTextLight{font:400 12.5px "Microsoft YaHei",Arial,sans-serif;fill:#d9e4f0}.arrow{stroke:#78899d;stroke-width:2;fill:none;marker-end:url(#arrow)}.arrowBlue{stroke:#2f6fed;stroke-width:2.3;fill:none;marker-end:url(#arrowBlue)}.arrowGold{stroke:#c98222;stroke-width:2.3;fill:none;marker-end:url(#arrowGold)}.arrowGreen{stroke:#33965b;stroke-width:2.3;fill:none;marker-end:url(#arrowGreen)}.badge{fill:#eaf2ff;stroke:#bdd3fb}.badgeText{font:700 12px "Microsoft YaHei",Arial,sans-serif;fill:#2455a6}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#78899d"/></marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#2f6fed"/></marker>
    <marker id="arrowGold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#c98222"/></marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#33965b"/></marker>
  </defs>
  <rect class="bg" width="1900" height="1220"/>
  <text x="70" y="62" class="title">船供供应链平台分层架构图</text>
  <text x="70" y="96" class="sub">从用户生态、业务应用、中台能力、数据基座到技术基础设施，覆盖采购链路、供应链金融、政府侧、银行、征信、税务、AI 模型与三方协同</text>

  <rect x="70" y="125" width="1760" height="118" rx="14" class="layer"/>
  <text x="95" y="158" class="layerTitle">01 用户与生态接入层</text><text x="95" y="181" class="layerNote">平台服务对象与外部协同主体</text>
  <rect x="300" y="150" width="190" height="62" rx="8" class="boxDark"/><text x="322" y="177" class="boxTitleLight">船代企业</text><text x="322" y="199" class="boxTextLight">采购、下单、付款、融资</text>
  <rect x="520" y="150" width="190" height="62" rx="8" class="boxDark"/><text x="542" y="177" class="boxTitleLight">供货商企业</text><text x="542" y="199" class="boxTextLight">报价、备货、供船、回款</text>
  <rect x="740" y="150" width="190" height="62" rx="8" class="boxDark"/><text x="762" y="177" class="boxTitleLight">驳船 / 交通艇 / 运输</text><text x="762" y="199" class="boxTextLight">调度、送船、签收、异常</text>
  <rect x="960" y="150" width="190" height="62" rx="8" class="boxDark"/><text x="982" y="177" class="boxTitleLight">船员服务</text><text x="982" y="199" class="boxTextLight">登轮、接送、港区服务</text>
  <rect x="1180" y="150" width="190" height="62" rx="8" class="boxGreen"/><text x="1202" y="177" class="boxTitle">政府侧</text><text x="1202" y="199" class="boxText">补贴、监管、资质协同</text>
  <rect x="1400" y="150" width="190" height="62" rx="8" class="boxGold"/><text x="1422" y="177" class="boxTitle">银行 / 金融机构</text><text x="1422" y="199" class="boxText">征信、授信、审批、放款</text>
  <rect x="1620" y="150" width="170" height="62" rx="8" class="boxPurple"/><text x="1642" y="177" class="boxTitle">三方生态</text><text x="1642" y="199" class="boxText">气象、AIS、保险、税务</text>

  <rect x="70" y="270" width="1760" height="125" rx="14" class="layer"/>
  <text x="95" y="304" class="layerTitle">02 门户与协同入口层</text><text x="95" y="327" class="layerNote">按角色承接业务入口，向外部生态开放标准接口</text>
  <rect x="300" y="302" width="250" height="62" rx="8" class="boxBlue"/><text x="322" y="329" class="boxTitle">业务工作台</text><text x="322" y="351" class="boxText">角色菜单、待办、状态、权限</text>
  <rect x="590" y="302" width="250" height="62" rx="8" class="boxBlue"/><text x="612" y="329" class="boxTitle">船代采购门户</text><text x="612" y="351" class="boxText">需求导入、比价、订单、归档</text>
  <rect x="880" y="302" width="250" height="62" rx="8" class="boxBlue"/><text x="902" y="329" class="boxTitle">供货商门户</text><text x="902" y="351" class="boxText">报价、供采、产品、履约、QC/QA</text>
  <rect x="1170" y="302" width="250" height="62" rx="8" class="boxBlue"/><text x="1192" y="329" class="boxTitle">运营/政府/金融门户</text><text x="1192" y="351" class="boxText">审核、补贴、融资、征信、税务</text>
  <rect x="1460" y="302" width="250" height="62" rx="8" class="boxBlue"/><text x="1482" y="329" class="boxTitle">开放接口 / API 网关</text><text x="1482" y="351" class="boxText">三方接入、数据交换、回调</text>

  <rect x="70" y="425" width="1760" height="210" rx="14" class="layer"/>
  <text x="95" y="459" class="layerTitle">03 业务应用层</text><text x="95" y="482" class="layerNote">围绕一张采购单组织端到端业务闭环</text>
  <rect x="300" y="470" width="365" height="62" rx="8" class="box"/><text x="322" y="497" class="boxTitle">船供采购</text><text x="322" y="519" class="boxText">物料/伙食、标准编码、大模型 SKU 匹配、报价准备</text>
  <rect x="690" y="470" width="170" height="62" rx="8" class="box"/><text x="712" y="497" class="boxTitle">询价报价</text><text x="712" y="519" class="boxText">模板、报价、原单导出</text>
  <rect x="885" y="470" width="170" height="62" rx="8" class="box"/><text x="907" y="497" class="boxTitle">比价决策</text><text x="907" y="519" class="boxText">最低混供、集中采购</text>
  <rect x="1080" y="470" width="170" height="62" rx="8" class="box"/><text x="1102" y="497" class="boxTitle">采购 / 供采订单</text><text x="1102" y="519" class="boxText">主单、子单、状态聚合</text>
  <rect x="1275" y="470" width="170" height="62" rx="8" class="box"/><text x="1297" y="497" class="boxTitle">港口履约送船</text><text x="1297" y="519" class="boxText">备货、驳船、签收</text>
  <rect x="1470" y="470" width="170" height="62" rx="8" class="box"/><text x="1492" y="497" class="boxTitle">结算归档</text><text x="1492" y="519" class="boxText">费用、发票、税务、单证</text>
  <rect x="300" y="550" width="215" height="62" rx="8" class="box"/><text x="322" y="577" class="boxTitle">供应商与店铺</text><text x="322" y="599" class="boxText">企业档案、SKU、联系人、资质</text>
  <rect x="550" y="550" width="215" height="62" rx="8" class="boxGold"/><text x="572" y="577" class="boxTitle">供应链金融</text><text x="572" y="599" class="boxText">应付、预付、融资、放款、还款</text>
  <rect x="800" y="550" width="215" height="62" rx="8" class="boxGreen"/><text x="822" y="577" class="boxTitle">政府补贴与监管</text><text x="822" y="599" class="boxText">补贴核验、税务合规、征信协同</text>
  <rect x="1050" y="550" width="215" height="62" rx="8" class="boxPurple"/><text x="1072" y="577" class="boxTitle">三方协同服务</text><text x="1072" y="599" class="boxText">气象、AIS、海关、保险、签章</text>
  <rect x="1300" y="550" width="215" height="62" rx="8" class="box"/><text x="1322" y="577" class="boxTitle">船员与海事服务</text><text x="1322" y="599" class="boxText">登轮、接送、报关报备</text>

  <path d="M665 501 H690" class="arrowBlue"/><path d="M860 501 H885" class="arrowBlue"/><path d="M1055 501 H1080" class="arrowBlue"/><path d="M1250 501 H1275" class="arrowBlue"/><path d="M1445 501 H1470" class="arrowBlue"/>
  <path d="M1165 532 C1165 548 680 535 657 550" class="arrowGold"/><path d="M907 550 C990 535 1170 535 1275 501" class="arrowGreen"/>

  <rect x="70" y="665" width="1760" height="155" rx="14" class="layer"/>
  <text x="95" y="699" class="layerTitle">04 中台能力层</text><text x="95" y="722" class="layerNote">沉淀跨业务复用能力</text>
  <rect x="300" y="720" width="165" height="62" rx="8" class="boxBlue"/><text x="319" y="747" class="boxTitle">标准主数据</text><text x="319" y="769" class="boxText">IMPA、港口、单位、币种</text>
  <rect x="485" y="720" width="165" height="62" rx="8" class="boxBlue"/><text x="504" y="747" class="boxTitle">大模型 SKU 匹配</text><text x="504" y="769" class="boxText">编码、名称、规格、异常</text>
  <rect x="670" y="720" width="165" height="62" rx="8" class="boxBlue"/><text x="689" y="747" class="boxTitle">报价价格引擎</text><text x="689" y="769" class="boxText">多单位、利润、汇率</text>
  <rect x="855" y="720" width="165" height="62" rx="8" class="boxBlue"/><text x="874" y="747" class="boxTitle">流程状态引擎</text><text x="874" y="769" class="boxText">需求、订单、履约、废弃</text>
  <rect x="1040" y="720" width="165" height="62" rx="8" class="boxBlue"/><text x="1059" y="747" class="boxTitle">组织权限中心</text><text x="1059" y="769" class="boxText">企业、成员、角色、菜单</text>
  <rect x="1225" y="720" width="165" height="62" rx="8" class="boxBlue"/><text x="1244" y="747" class="boxTitle">文件单证中心</text><text x="1244" y="769" class="boxText">模板、图片、资质、发票</text>
  <rect x="1410" y="720" width="165" height="62" rx="8" class="boxGold"/><text x="1429" y="747" class="boxTitle">征信风控授信</text><text x="1429" y="769" class="boxText">真实性、征信、税务、履约</text>
  <rect x="1595" y="720" width="165" height="62" rx="8" class="boxPurple"/><text x="1614" y="747" class="boxTitle">AI 模型能力</text><text x="1614" y="769" class="boxText">识别、解析、SKU 匹配、风控</text>

  <rect x="70" y="850" width="1760" height="145" rx="14" class="layer"/>
  <text x="95" y="884" class="layerTitle">05 数据基座层</text><text x="95" y="907" class="layerNote">统一建模、追踪、审计与分析</text>
  <rect x="300" y="905" width="210" height="58" rx="8" class="box"/><text x="322" y="931" class="boxTitle">主数据</text><text x="322" y="952" class="boxText">企业、用户、供应商、港口、字典</text>
  <rect x="535" y="905" width="210" height="58" rx="8" class="box"/><text x="557" y="931" class="boxTitle">商品与标准库数据</text><text x="557" y="952" class="boxText">IMPA、伙食品类、SKU、多单位价格</text>
  <rect x="770" y="905" width="210" height="58" rx="8" class="box"/><text x="792" y="931" class="boxTitle">交易数据</text><text x="792" y="952" class="boxText">需求、询价、报价、比价、订单</text>
  <rect x="1005" y="905" width="210" height="58" rx="8" class="box"/><text x="1027" y="931" class="boxTitle">履约与结算数据</text><text x="1027" y="952" class="boxText">备货、供船、签收、费用、发票</text>
  <rect x="1240" y="905" width="210" height="58" rx="8" class="boxGold"/><text x="1262" y="931" class="boxTitle">金融/征信/补贴数据</text><text x="1262" y="952" class="boxText">融资、放款、还款、补贴、征信</text>
  <rect x="1475" y="905" width="210" height="58" rx="8" class="boxPurple"/><text x="1497" y="931" class="boxTitle">模型与外部数据</text><text x="1497" y="952" class="boxText">模型结果、气象、AIS、税务、支付</text>

  <rect x="70" y="1025" width="1760" height="125" rx="14" class="layer"/>
  <text x="95" y="1059" class="layerTitle">06 技术基础设施层</text><text x="95" y="1082" class="layerNote">运行、集成、安全与运维基础</text>
  <rect x="300" y="1060" width="185" height="58" rx="8" class="box"/><text x="322" y="1086" class="boxTitle">前端应用</text><text x="322" y="1107" class="boxText">Vue 3 + TypeScript + Vite</text>
  <rect x="510" y="1060" width="185" height="58" rx="8" class="box"/><text x="532" y="1086" class="boxTitle">后端服务</text><text x="532" y="1107" class="boxText">Java + Spring Boot 模块化单体</text>
  <rect x="720" y="1060" width="185" height="58" rx="8" class="box"/><text x="742" y="1086" class="boxTitle">数据库</text><text x="742" y="1107" class="boxText">MySQL 8.0</text>
  <rect x="930" y="1060" width="185" height="58" rx="8" class="box"/><text x="952" y="1086" class="boxTitle">缓存与会话</text><text x="952" y="1107" class="boxText">Redis / Token</text>
  <rect x="1140" y="1060" width="185" height="58" rx="8" class="box"/><text x="1162" y="1086" class="boxTitle">文件存储</text><text x="1162" y="1107" class="boxText">模板、图片、资质、归档</text>
  <rect x="1350" y="1060" width="185" height="58" rx="8" class="box"/><text x="1372" y="1086" class="boxTitle">集成与模型服务</text><text x="1372" y="1107" class="boxText">API、Webhook、模型网关</text>
  <rect x="1560" y="1060" width="185" height="58" rx="8" class="box"/><text x="1582" y="1086" class="boxTitle">安全与运维</text><text x="1582" y="1107" class="boxText">认证、权限、日志、备份、监控</text>

  <path d="M395 212 V302" class="arrowBlue"/><path d="M615 212 V302" class="arrowBlue"/><path d="M835 212 V302" class="arrowBlue"/><path d="M1275 212 V302" class="arrowGreen"/><path d="M1495 212 V302" class="arrowGold"/><path d="M1705 212 V302" class="arrow"/>
  <path d="M715 364 V470" class="arrowBlue"/><path d="M1005 364 V470" class="arrowBlue"/><path d="M1295 364 V550" class="arrowGreen"/><path d="M1585 364 V550" class="arrow"/>
  <path d="M970 532 V720" class="arrowBlue"/><path d="M657 612 V720" class="arrowGold"/><path d="M907 612 V720" class="arrowGreen"/><path d="M1157 612 V720" class="arrow"/>
  <path d="M382 782 V905" class="arrow"/><path d="M567 782 V905" class="arrow"/><path d="M752 782 V905" class="arrow"/><path d="M937 782 V905" class="arrow"/><path d="M1492 782 V905" class="arrowGold"/><path d="M1677 782 V905" class="arrow"/>
