  <rect x="70" y="1168" width="1760" height="28" rx="14" class="badge"/>
  <text x="95" y="1187" class="badgeText">说明：此图为业务 + 数据 + 技术的分层架构表达；征信与税务分别支撑授信风控、补贴核验、票税合规和结算归档，AI 模型能力承接清单识别、报价解析与大模型 SKU 匹配。</text>
</svg>
