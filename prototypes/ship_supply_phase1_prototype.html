<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>船供平台一期低保真原型</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --surface: #ffffff;
      --line: #d8dee8;
      --line-strong: #b7c2d2;
      --text: #1d2733;
      --muted: #647386;
      --blue: #1f5f99;
      --blue-soft: #e6f0fa;
      --green: #2f7d57;
      --green-soft: #e7f3ed;
      --amber: #a86513;
      --amber-soft: #fff1dc;
      --red: #b44444;
      --red-soft: #fde8e8;
      --purple: #6a4c93;
      --purple-soft: #efe9f7;
      --radius: 8px;
      --shadow: 0 1px 2px rgba(21, 32, 43, .08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      font-size: 14px;
      letter-spacing: 0;
    }

    button, input, select, textarea {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 248px minmax(0, 1fr);
    }

    .sidebar {
      background: #142235;
      color: #dce7f5;
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 8px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, .14);
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: #e6f0fa;
      color: #143a5c;
      font-weight: 800;
    }

    .brand strong {
      display: block;
      font-size: 16px;
      color: #ffffff;
    }

    .brand span {
      display: block;
      margin-top: 2px;
      font-size: 12px;
      color: #9fb2c8;
    }

    .role-switch {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 4px;
      background: rgba(255, 255, 255, .08);
      border-radius: 8px;
    }

    .role-switch button {
      min-height: 30px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #bed0e5;
      cursor: pointer;
    }

    .role-switch button.active {
      background: #ffffff;
      color: #142235;
      font-weight: 700;
    }

    .nav-title {
      margin: 4px 8px 2px;
      color: #8ea4bc;
      font-size: 12px;
    }

    .nav {
      display: grid;
      gap: 4px;
    }

    .nav button {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 38px;
      padding: 8px 10px;
      border: 0;
      border-radius: 7px;
      text-align: left;
      color: #dce7f5;
      background: transparent;
      cursor: pointer;
    }

    .nav button:hover,
    .nav button.active {
      background: rgba(255, 255, 255, .12);
      color: #ffffff;
    }

    .nav .ico {
      width: 22px;
      text-align: center;
      color: #9fc6ee;
      font-weight: 800;
    }

    main {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    .topbar h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
      white-space: nowrap;
    }

    .topbar p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .utility {
      display: flex;
      align-items: center;
      gap: 14px;
      color: #617188;
      font-size: 13px;
      margin-right: 8px;
    }

    .topbar > div:first-child {
      min-width: 170px;
      flex: 0 0 auto;
    }

    .utility span {
      white-space: nowrap;
    }

    .btn {
      min-height: 34px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      padding: 0 12px;
      background: #ffffff;
      color: var(--text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
    }

    .btn.primary {
      border-color: var(--blue);
      background: var(--blue);
      color: #ffffff;
    }

    .btn.ghost {
      border-color: transparent;
      background: transparent;
    }

    .btn.small {
      min-height: 28px;
      padding: 0 9px;
      font-size: 12px;
    }

    .content {
      padding: 20px 24px 28px;
      overflow: auto;
    }

    .notice-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 42px;
      padding: 9px 14px;
      margin-bottom: 12px;
      border: 1px solid #fde0bd;
      border-radius: 8px;
      background: #fff7ed;
      color: #7a4a12;
      font-size: 13px;
    }

    .filter-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .filter-chip {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      border: 1px solid #d7e0ec;
      border-radius: 8px;
      background: #ffffff;
      color: #334155;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(16, 24, 39, .04);
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .field,
    .select {
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #ffffff;
      padding: 0 10px;
      color: var(--text);
      min-width: 130px;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(130px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .metric {
      min-height: 86px;
      padding: 14px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .metric span {
      color: var(--muted);
      font-size: 12px;
    }

    .metric strong {
      display: block;
      margin-top: 8px;
      font-size: 26px;
      line-height: 1;
    }

    .layout-two {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(320px, .85fr);
      gap: 14px;
      align-items: start;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .panel-head {
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
    }

    .panel-head h2,
    .panel-head h3 {
      margin: 0;
      font-size: 15px;
    }

    .panel-body {
      padding: 14px;
    }

    .table {
      width: 100%;
      border-collapse: collapse;
    }

    .table th,
    .table td {
      padding: 10px 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: middle;
    }

    .table th {
      color: var(--muted);
      font-weight: 700;
      background: #f7f9fc;
      font-size: 12px;
    }

    .table tr:last-child td {
      border-bottom: 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .badge.blue { background: var(--blue-soft); color: var(--blue); }
    .badge.green { background: var(--green-soft); color: var(--green); }
    .badge.amber { background: var(--amber-soft); color: var(--amber); }
    .badge.red { background: var(--red-soft); color: var(--red); }
    .badge.purple { background: var(--purple-soft); color: var(--purple); }
    .badge.gray { background: #eef1f5; color: #596779; }

    .timeline {
      display: grid;
      grid-template-columns: repeat(8, minmax(110px, 1fr));
      gap: 8px;
      margin-bottom: 14px;
    }

    .step {
      position: relative;
      min-height: 76px;
      padding: 12px 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #ffffff;
    }

    .step.done { border-color: #9bc3ad; background: var(--green-soft); }
    .step.current { border-color: #7fa9d4; background: var(--blue-soft); }
    .step strong { display: block; margin-bottom: 6px; }
    .step span { color: var(--muted); font-size: 12px; }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(160px, 1fr));
      gap: 12px;
    }

    .form-item label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .form-item input,
    .form-item select,
    .form-item textarea {
      width: 100%;
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 8px 10px;
      background: #ffffff;
      color: var(--text);
    }

    .form-item textarea {
      min-height: 72px;
      resize: vertical;
    }

    .span-2 { grid-column: span 2; }
    .span-4 { grid-column: span 4; }

    .split-list {
      display: grid;
      gap: 10px;
    }

    .task-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }

    .task-row:last-child {
      border-bottom: 0;
    }

    .task-row strong {
      display: block;
      margin-bottom: 4px;
    }

    .task-row span {
      color: var(--muted);
      font-size: 12px;
    }

    .quote-grid {
      display: grid;
      grid-template-columns: 220px repeat(3, minmax(180px, 1fr));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .quote-cell {
      min-height: 58px;
      padding: 10px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: #ffffff;
    }

    .quote-cell:nth-child(4n) {
      border-right: 0;
    }

    .quote-cell.head {
      background: #f7f9fc;
      font-weight: 700;
    }

    .quote-cell.win {
      background: var(--green-soft);
    }

    .empty {
      min-height: 130px;
      display: grid;
      place-items: center;
      color: var(--muted);
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius);
      background: #fbfcfe;
    }

    .tabs {
      display: flex;
      gap: 6px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f7f9fc;
    }

    .tabs button {
      min-height: 30px;
      padding: 0 10px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
    }

    .tabs button.active {
      background: #ffffff;
      box-shadow: var(--shadow);
      font-weight: 700;
    }

    .drawer {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10, 18, 30, .42);
      z-index: 10;
      align-items: stretch;
      justify-content: flex-end;
    }

    .drawer.open {
      display: flex;
    }

    .drawer-panel {
      width: min(620px, 100vw);
      background: #ffffff;
      padding: 18px;
      overflow: auto;
      box-shadow: -8px 0 22px rgba(0, 0, 0, .16);
    }

    .drawer-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .drawer-head h2 {
      margin: 0;
      font-size: 18px;
    }

    /* Visual refinement pass: denser, cleaner operational SaaS styling. */
    body {
      background: #eef2f6;
      color: #17202c;
    }

    .app {
      grid-template-columns: 260px minmax(0, 1fr);
    }

    .sidebar {
      background: #101827;
      border-right: 1px solid rgba(255, 255, 255, .08);
      box-shadow: 8px 0 24px rgba(16, 24, 39, .08);
    }

    .brand {
      padding: 2px 6px 16px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      background: #dbeafe;
      color: #12395c;
      box-shadow: inset 0 0 0 1px rgba(18, 57, 92, .08);
    }

    .role-switch {
      background: rgba(255, 255, 255, .07);
      border: 1px solid rgba(255, 255, 255, .08);
    }

    .role-switch button {
      color: #aebed0;
      font-weight: 700;
    }

    .role-switch button.active {
      background: #f8fafc;
      color: #101827;
    }

    .nav-title {
      margin-top: 8px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .nav button {
      min-height: 40px;
      padding: 8px 11px;
      color: #d5e0ed;
    }

    .nav button:hover {
      background: rgba(219, 234, 254, .10);
    }

    .nav button.active {
      background: #263449;
      box-shadow: inset 3px 0 0 #60a5fa;
    }

    .topbar {
      min-height: 72px;
      height: auto;
      padding: 14px 28px;
      background: rgba(255, 255, 255, .92);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 5;
    }

    .topbar h1 {
      font-size: 22px;
      font-weight: 800;
    }

    .topbar p {
      font-size: 13px;
    }

    .content {
      padding: 22px 28px 34px;
    }

    .btn {
      min-height: 36px;
      border-color: #c9d3e2;
      box-shadow: 0 1px 1px rgba(16, 24, 39, .04);
      transition: background .15s ease, border-color .15s ease, box-shadow .15s ease;
    }

    .btn:hover {
      border-color: #9fb1c8;
      box-shadow: 0 2px 6px rgba(16, 24, 39, .08);
    }

    .btn.primary {
      background: #155f9f;
      border-color: #155f9f;
    }

    .btn.primary:hover {
      background: #0f4f88;
      border-color: #0f4f88;
    }

    .metric-grid {
      grid-template-columns: repeat(6, minmax(150px, 1fr));
      gap: 14px;
    }

    .metric {
      min-height: 94px;
      padding: 16px;
      border-color: #dce3ee;
      background: #ffffff;
      box-shadow: 0 8px 22px rgba(16, 24, 39, .05);
    }

    .metric span {
      font-weight: 700;
      color: #65758a;
    }

    .metric strong {
      font-size: 30px;
      color: #132033;
    }

    .layout-two {
      grid-template-columns: minmax(680px, 1.35fr) minmax(360px, .75fr);
      gap: 16px;
    }

    .panel {
      border-color: #dce3ee;
      background: #ffffff;
      box-shadow: 0 8px 22px rgba(16, 24, 39, .05);
    }

    .panel-head {
      min-height: 54px;
      padding: 13px 16px;
      background: #fbfcfe;
    }

    .panel-head h2,
    .panel-head h3 {
      font-size: 16px;
      font-weight: 800;
    }

    .panel-body {
      padding: 0;
      overflow-x: auto;
    }

    .panel-body > .form-grid,
    .panel-body > .split-list,
    .panel-body > .empty,
    .panel-body > .quote-grid {
      margin: 16px;
    }

    .panel-body > .quote-grid {
      width: calc(100% - 32px);
    }

    .table {
      min-width: 1080px;
      table-layout: auto;
      font-size: 13px;
    }

    .table th,
    .table td {
      padding: 12px 14px;
      white-space: nowrap;
      line-height: 1.45;
    }

    .table th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #f6f8fb;
      color: #58697d;
    }

    .table td:nth-child(2),
    .table td:nth-child(3) {
      white-space: normal;
      min-width: 150px;
    }

    .badge {
      min-height: 26px;
      padding: 0 10px;
      font-size: 12px;
      font-weight: 800;
    }

    .toolbar {
      padding: 12px 14px;
      border: 1px solid #dce3ee;
      border-radius: var(--radius);
      background: #ffffff;
      box-shadow: 0 8px 22px rgba(16, 24, 39, .04);
    }

    .field,
    .select,
    .form-item input,
    .form-item select,
    .form-item textarea {
      border-color: #cfd8e6;
      background: #fbfcfe;
    }

    .field:focus,
    .select:focus,
    .form-item input:focus,
    .form-item select:focus,
    .form-item textarea:focus {
      outline: 2px solid rgba(31, 95, 153, .18);
      border-color: #1f5f99;
      background: #ffffff;
    }

    .timeline {
      gap: 10px;
    }

    .step {
      border-color: #dce3ee;
      box-shadow: 0 6px 16px rgba(16, 24, 39, .04);
    }

    .task-row {
      padding: 14px 16px;
    }

    .task-row strong {
      font-size: 14px;
    }

    .quote-grid {
      box-shadow: 0 6px 16px rgba(16, 24, 39, .04);
    }

    .quote-cell {
      padding: 12px;
      line-height: 1.45;
    }

    .command-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 16px;
      align-items: start;
    }

    .overview-strip {
      display: grid;
      grid-template-columns: minmax(260px, 1.35fr) repeat(3, minmax(130px, .65fr));
      gap: 14px;
      margin-bottom: 16px;
    }

    .hero-card {
      min-height: 156px;
      padding: 18px;
      border: 1px solid #dbe4f0;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 10px 28px rgba(16, 24, 39, .06);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .hero-card .eyebrow {
      color: #607286;
      font-size: 12px;
      font-weight: 800;
    }

    .hero-card strong {
      display: block;
      margin-top: 8px;
      font-size: 28px;
      line-height: 1.15;
      color: #132033;
    }

    .hero-card p {
      margin: 8px 0 0;
      color: #607286;
      line-height: 1.55;
    }

    .mini-stat {
      min-height: 156px;
      padding: 16px;
      border: 1px solid #dbe4f0;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 10px 28px rgba(16, 24, 39, .05);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .mini-stat span {
      color: #607286;
      font-size: 12px;
      font-weight: 800;
    }

    .mini-stat strong {
      display: block;
      margin-top: 8px;
      font-size: 30px;
      line-height: 1;
    }

    .mini-stat small {
      color: #728196;
      line-height: 1.4;
    }

    .stage-strip {
      display: grid;
      grid-template-columns: repeat(6, minmax(120px, 1fr));
      gap: 8px;
      margin-bottom: 16px;
    }

    .stage-pill {
      min-height: 54px;
      padding: 10px 12px;
      border: 1px solid #dbe4f0;
      border-radius: 8px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .stage-pill b {
      font-size: 13px;
    }

    .stage-pill span {
      min-width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: #eef5fb;
      color: #155f9f;
      font-weight: 900;
    }

    .command-panel .panel-body {
      overflow-x: auto;
    }

    .side-stack {
      display: grid;
      gap: 14px;
    }

    .signal-list {
      padding: 6px 0;
    }

    .signal {
      display: grid;
      grid-template-columns: 8px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: start;
      padding: 13px 16px;
      border-bottom: 1px solid #e5ebf3;
    }

    .signal:last-child {
      border-bottom: 0;
    }

    .signal-dot {
      width: 8px;
      height: 8px;
      border-radius: 99px;
      margin-top: 7px;
      background: #155f9f;
    }

    .signal-dot.warn { background: #c87919; }
    .signal-dot.risk { background: #c2414b; }
    .signal-dot.good { background: #2f7d57; }

    .signal strong {
      display: block;
      margin-bottom: 4px;
    }

    .signal p {
      margin: 0;
      color: #65758a;
      font-size: 12px;
      line-height: 1.45;
    }

    .status-matrix {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 16px;
    }

    .status-tile {
      min-height: 78px;
      padding: 12px;
      border: 1px solid #e1e7f0;
      border-radius: 8px;
      background: #fbfcfe;
    }
